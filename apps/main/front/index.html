<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>主应用 - Micro App</title>
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            .orbit-boot {
                --loader-accent: #1677ff;
                --loader-accent-soft: rgba(22, 119, 255, 0.35);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 28px;
                width: 100%;
                height: 100%;
                min-height: 100vh;
                padding: 24px;
                background:
                    radial-gradient(ellipse 60% 50% at 50% 42%, var(--loader-accent-soft), transparent 70%),
                    #f5f5f5;
                font-family: 'Segoe UI', 'DIN Alternate', 'Helvetica Neue', sans-serif;
            }

            .orbit-boot__orb {
                position: relative;
                width: 120px;
                height: 120px;
                animation: orb-breathe 2.4s ease-in-out infinite;
            }

            .orbit-boot__ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 1.5px solid transparent;
                box-sizing: border-box;
            }

            .orbit-boot__ring--outer {
                border-top-color: var(--loader-accent);
                border-right-color: rgba(22, 119, 255, 0.4);
                animation: spin-cw 1.6s linear infinite;
                filter: drop-shadow(0 0 6px var(--loader-accent-soft));
            }

            .orbit-boot__ring--mid {
                inset: 14px;
                border-style: dashed;
                border-bottom-color: var(--loader-accent);
                border-left-color: rgba(22, 119, 255, 0.55);
                animation: spin-ccw 2.2s linear infinite;
                opacity: 0.85;
            }

            .orbit-boot__ring--inner {
                inset: 28px;
                border-top-color: rgba(105, 177, 255, 1);
                border-bottom-color: rgba(22, 119, 255, 0.35);
                animation: spin-cw 1.1s linear infinite;
            }

            .orbit-boot__core {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 22px;
                height: 22px;
                margin: -11px 0 0 -11px;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 30%, #fff, var(--loader-accent) 55%, transparent 75%);
                box-shadow:
                    0 0 16px var(--loader-accent),
                    0 0 32px var(--loader-accent-soft);
            }

            .orbit-boot__core-pulse {
                position: absolute;
                inset: -10px;
                border-radius: 50%;
                border: 1px solid var(--loader-accent);
                animation: core-pulse 1.6s ease-out infinite;
                opacity: 0.6;
            }

            .orbit-boot__sat {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 8px;
                height: 8px;
                margin: -4px 0 0 -4px;
                border-radius: 50%;
                background: var(--loader-accent);
                box-shadow: 0 0 10px var(--loader-accent);
            }

            .orbit-boot__sat--a {
                animation: orbit-a 2s linear infinite;
            }

            .orbit-boot__sat--b {
                width: 6px;
                height: 6px;
                margin: -3px 0 0 -3px;
                animation: orbit-b 2.8s linear infinite;
                opacity: 0.75;
            }

            .orbit-boot__sat--c {
                width: 5px;
                height: 5px;
                margin: -2.5px 0 0 -2.5px;
                animation: orbit-c 3.4s linear infinite;
                opacity: 0.55;
            }

            .orbit-boot__meta {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                min-width: 200px;
            }

            .orbit-boot__title {
                display: flex;
                gap: 3px;
                margin: 0;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.35em;
                color: rgba(0, 0, 0, 0.88);
            }

            .orbit-boot__char {
                display: inline-block;
                animation: char-bounce 1.2s ease-in-out infinite;
            }

            .orbit-boot__char:nth-child(1) { animation-delay: 0s; }
            .orbit-boot__char:nth-child(2) { animation-delay: 0.08s; }
            .orbit-boot__char:nth-child(3) { animation-delay: 0.16s; }
            .orbit-boot__char:nth-child(4) { animation-delay: 0.24s; }
            .orbit-boot__char:nth-child(5) { animation-delay: 0.32s; }
            .orbit-boot__char:nth-child(6) { animation-delay: 0.4s; }
            .orbit-boot__char:nth-child(7) { animation-delay: 0.48s; }

            .orbit-boot__hint {
                margin: 0;
                font-size: 12px;
                letter-spacing: 0.08em;
                color: rgba(0, 0, 0, 0.45);
            }

            .orbit-boot__bar {
                position: relative;
                overflow: hidden;
                width: 160px;
                height: 2px;
                border-radius: 999px;
                background: rgba(22, 119, 255, 0.18);
            }

            .orbit-boot__bar-glow {
                position: absolute;
                top: 0;
                left: -40%;
                width: 40%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, transparent, var(--loader-accent), transparent);
                animation: bar-scan 1.4s ease-in-out infinite;
                box-shadow: 0 0 12px var(--loader-accent);
            }

            @keyframes spin-cw { to { transform: rotate(360deg); } }
            @keyframes spin-ccw { to { transform: rotate(-360deg); } }
            @keyframes orb-breathe {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.04); }
            }
            @keyframes core-pulse {
                0% { transform: scale(0.6); opacity: 0.7; }
                100% { transform: scale(1.8); opacity: 0; }
            }
            @keyframes orbit-a {
                from { transform: rotate(0deg) translateX(52px) rotate(0deg); }
                to { transform: rotate(360deg) translateX(52px) rotate(-360deg); }
            }
            @keyframes orbit-b {
                from { transform: rotate(120deg) translateX(40px) rotate(-120deg); }
                to { transform: rotate(480deg) translateX(40px) rotate(-480deg); }
            }
            @keyframes orbit-c {
                from { transform: rotate(240deg) translateX(30px) rotate(-240deg); }
                to { transform: rotate(600deg) translateX(30px) rotate(-600deg); }
            }
            @keyframes char-bounce {
                0%, 100% { transform: translateY(0); opacity: 0.55; }
                40% { transform: translateY(-4px); opacity: 1; }
            }
            @keyframes bar-scan {
                0% { left: -40%; }
                100% { left: 100%; }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="orbit-boot">
                <div class="orbit-boot__orb">
                    <span class="orbit-boot__ring orbit-boot__ring--outer"></span>
                    <span class="orbit-boot__ring orbit-boot__ring--mid"></span>
                    <span class="orbit-boot__ring orbit-boot__ring--inner"></span>
                    <span class="orbit-boot__core">
                        <span class="orbit-boot__core-pulse"></span>
                    </span>
                    <span class="orbit-boot__sat orbit-boot__sat--a"></span>
                    <span class="orbit-boot__sat orbit-boot__sat--b"></span>
                    <span class="orbit-boot__sat orbit-boot__sat--c"></span>
                </div>
                <div class="orbit-boot__meta">
                    <p class="orbit-boot__title">
                        <span class="orbit-boot__char">L</span>
                        <span class="orbit-boot__char">O</span>
                        <span class="orbit-boot__char">A</span>
                        <span class="orbit-boot__char">D</span>
                        <span class="orbit-boot__char">I</span>
                        <span class="orbit-boot__char">N</span>
                        <span class="orbit-boot__char">G</span>
                    </p>
                    <p class="orbit-boot__hint">正在启动应用</p>
                    <div class="orbit-boot__bar">
                        <span class="orbit-boot__bar-glow"></span>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
